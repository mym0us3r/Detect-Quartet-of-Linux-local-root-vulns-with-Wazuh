# LPE Quartet 2026 - Wazuh SCA policy
# DirtyAH6 CVE-2026-80844 | TUNderflow CVE-2026-81000
# PPPoEject CVE-2026-68121 | DiagSpill CVE-2026-74469
# Author: Kislley Rodrigues

policy:
  id: "lpe_quartet_2026"
  file: "lpe_quartet_2026.yml"
  name: "LPE Quartet 2026 - detection sensor and exploit prerequisites"
  description: "Checks that the auditd sensor used by the Wazuh LPE Quartet rules is in place and that the kernel prerequisites of DirtyAH6, TUNderflow, PPPoEject and DiagSpill are closed. Compensating controls only: the fix is a kernel with the four patches."
  references:
    - https://heyitsas.im/posts/lpe-quartet/
    - https://documentation.wazuh.com/4.14/user-manual/capabilities/sec-config-assessment/creating-custom-policies.html
  regex_type: "pcre2"

requirements:
  title: "Linux endpoint"
  description: "Runs only on Linux endpoints."
  condition: all
  rules:
    - 'f:/proc/sys/kernel/osrelease'

checks:
  - id: 400101
    title: "auditd is running"
    description: "The auditd daemon collects the syscall events used by the LPE Quartet Wazuh rules."
    rationale: "Without auditd the Wazuh rules 400001-400015 receive no events."
    remediation: "systemctl enable --now auditd"
    compliance:
      - mitre_techniques: ["T1068"]
    condition: all
    rules:
      - 'p:auditd'

  - id: 400102
    title: "LPE Quartet auditd rules file is present"
    description: "/etc/audit/rules.d/lpe-quartet-2026.rules defines the eight lpe_quartet_* keys."
    rationale: "Each Wazuh rule matches one of these keys."
    remediation: "Copy lpe-quartet-2026.rules to /etc/audit/rules.d/ and run augenrules --load."
    compliance:
      - mitre_techniques: ["T1068"]
    condition: all
    rules:
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_userns$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_rawv6$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_xfrm$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_tun$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_netlink_route$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_sctp$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_sockdiag$'
      - 'f:/etc/audit/rules.d/lpe-quartet-2026.rules -> r:-k lpe_quartet_tmp_exec$'

  - id: 400103
    title: "LPE Quartet auditd rules are loaded in the kernel"
    description: "auditctl -l lists the eight lpe_quartet_* keys."
    rationale: "A rules file on disk is not active until it is loaded."
    remediation: "augenrules --load && auditctl -l | grep lpe_quartet"
    compliance:
      - mitre_techniques: ["T1068"]
    condition: all
    rules:
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_userns$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_rawv6$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_xfrm$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_tun$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_netlink_route$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_sctp$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_sockdiag$'
      - 'c:/usr/sbin/auditctl -l -> r:lpe_quartet_tmp_exec$'

  - id: 400104
    title: "Unprivileged user namespaces are disabled"
    description: "DirtyAH6, TUNderflow and PPPoEject require an unprivileged user namespace."
    rationale: "Blocking unprivileged user namespaces removes the prerequisite of three of the four vulnerabilities. kernel.apparmor_restrict_unprivileged_userns=1 alone does not block namespace creation."
    remediation: "echo 'user.max_user_namespaces = 0' > /etc/sysctl.d/99-lpe-quartet.conf && sysctl --system. Impact: breaks rootless containers and browser sandboxes that rely on user namespaces."
    compliance:
      - mitre_techniques: ["T1068"]
    condition: any
    rules:
      - 'f:/proc/sys/user/max_user_namespaces -> r:^0$'
      - 'f:/proc/sys/kernel/unprivileged_userns_clone -> r:^0$'

  - id: 400105
    title: "sctp kernel module is disabled and not loaded"
    description: "DiagSpill requires the sctp and sctp_diag modules and no privilege."
    rationale: "Blocking sctp removes the only prerequisite of DiagSpill."
    remediation: "printf 'install sctp /bin/false\\nblacklist sctp\\n' > /etc/modprobe.d/lpe-quartet-sctp.conf && modprobe -r sctp"
    compliance:
      - mitre_techniques: ["T1068"]
    condition: all
    rules:
      - 'c:/usr/sbin/modprobe -n -v sctp -> r:^install\s+/bin/(true|false)'
      - 'not f:/proc/modules -> r:^sctp\s'

  - id: 400106
    title: "pppoe kernel module is disabled and not loaded"
    description: "PPPoEject requires the vulnerable pppoe_sendmsg() path."
    rationale: "Blocking pppoe removes the code path of PPPoEject on hosts that do not use PPPoE."
    remediation: "printf 'install pppoe /bin/false\\nblacklist pppoe\\n' > /etc/modprobe.d/lpe-quartet-pppoe.conf && modprobe -r pppoe"
    compliance:
      - mitre_techniques: ["T1068"]
    condition: all
    rules:
      - 'c:/usr/sbin/modprobe -n -v pppoe -> r:^install\s+/bin/(true|false)'
      - 'not f:/proc/modules -> r:^pppoe\s'

  - id: 400107
    title: "ah6 kernel module is disabled and not loaded"
    description: "DirtyAH6 requires IPv6 Authentication Header support."
    rationale: "Blocking ah6 removes the code path of DirtyAH6 on hosts that do not use IPsec AH over IPv6."
    remediation: "printf 'install ah6 /bin/false\\nblacklist ah6\\n' > /etc/modprobe.d/lpe-quartet-ah6.conf && modprobe -r ah6"
    compliance:
      - mitre_techniques: ["T1068"]
    condition: all
    rules:
      - 'c:/usr/sbin/modprobe -n -v ah6 -> r:^install\s+/bin/(true|false)'
      - 'not f:/proc/modules -> r:^ah6\s'
